name: Build Aswell Shell

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile Release Binaries
        run: |
          make clean
          make -j$(nproc)

      - name: Verify Shell and Engine Demo
        run: |
          echo "Verifying shell version and basic commands..."
          ./bin/aswell --version
          ./bin/aswell -c 'echo "Aswell build verified successfully!"'

          echo "Verifying engine demo auto-run..."
          ./bin/aswell demo --auto
          ./bin/demo_engine --auto

      - name: Strip Debug Symbols
        run: |
          strip bin/aswell
          strip bin/demo_engine

      - name: Upload Aswell Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aswell-linux-x86_64
          path: |
            bin/aswell
            bin/demo_engine
          if-no-files-found: error
